[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-bsl"
description = "1C (BSL) language"
dynamic = ["version"]
keywords = ["incremental", "parsing", "tree-sitter", "bsl"]
classifiers = [
  "Intended Audience :: Developers",
  "Private :: Do Not Upload",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "alkoleft" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[project.urls]
Homepage = "https://github.com/cujoko/tree-sitter-bsl"
repository = "https://github.com/cujoko/tree-sitter-bsl"

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"

[tool.setuptools.dynamic]
version = {attr = "tree_sitter_bsl._version.__version__"}

[tool.setuptools.package-dir]
"" = "bindings/python"
